name: Publiceer cursus

# De LaTeX (Overleaf) is de enige bron. Bij elke wijziging op main:
#   1. figuren (Python, site/_figuren) -> PDF in Figuren/ voor het boek (terug in de repo, zodat Overleaf ze krijgt)
#   2. boek-PDF maken met LaTeX (controle + download op de site)
#   3. LaTeX -> Quarto-pagina's (site/tools/tex2qmd.py) en de site bouwen
#   4. publiceren op GitHub Pages
# Bij een pull request gebeuren 1-3 enkel als controle.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publiceer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y -q pandoc

      - name: Figuren voor het boek (PDF)
        run: python3 site/_figuren/maak_pdf.py Figuren

      - name: Nieuwe figuren terug in de repo (voor Overleaf)
        if: github.event_name != 'pull_request'
        run: |
          git add -A Figuren
          if git diff --cached --quiet; then echo "geen nieuwe figuren"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Figuren bijgewerkt (automatisch)"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break; sleep 5; done

      - name: Boek (PDF) met LaTeX
        id: boek
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: LaTeX omzetten naar de site
        run: python3 site/tools/tex2qmd.py . site

      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
        working-directory: site
      - name: Boek-PDF bij de site
        run: if [ -f main.pdf ]; then cp main.pdf site/_book/fysicochemie.pdf; fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/_book
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: voorbeeld
          path: site/_book

  publiceer:
    if: github.event_name != 'pull_request'
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
