project:
  type: book
  output-dir: _book

lang: nl

# Figuren worden bij het bouwen getekend met Python (zie _figuren/)
execute:
  echo: false
  warning: false

book:
  title: "Fysicochemie"
  subtitle: "Chemische thermodynamica voor industrieel ingenieurs"
  author: "Stijn De Jonge"
  date: "2026-2027"
  search: true
  page-navigation: true
  navbar:
    left:
      - text: "Over de cursus"
        href: index.qmd
      - text: "Thermodynamica"
        menu:
          - energie.qmd
          - spontaniteit.qmd
          - niet-reagerend-evenwicht.qmd
          - reagerend-evenwicht.qmd
          - elektrochemie.qmd
      - text: "Structuur van materie"
        menu:
          - kwantum.qmd
          - intermoleculair.qmd
          - kristallografie.qmd
      - text: "Kinetiek en oppervlakken"
        menu:
          - kinetica.qmd
          - oppervlaktechemie.qmd
    right:
      - text: "Toledo"
        href: https://toledo.kuleuven.be
        icon: box-arrow-up-right
  chapters:
    - index.qmd
    - energie.qmd
    - kwantum.qmd
    - spontaniteit.qmd
    - intermoleculair.qmd
    - niet-reagerend-evenwicht.qmd
    - reagerend-evenwicht.qmd
    - elektrochemie.qmd
    - kinetica.qmd
    - oppervlaktechemie.qmd
    - kristallografie.qmd
  page-footer:
    center: "Fysicochemie · KU Leuven · Faculteit Industriële Ingenieurswetenschappen"

format:
  html:
    theme:
      light: [cosmo, kleuren-licht.scss, stijl.scss]
      dark: [darkly, kleuren-donker.scss, stijl.scss]
    number-sections: true
    number-depth: 3
    toc: true
    toc-depth: 3
    toc-title: "Op deze pagina"
    include-in-header: _docent.html
    html-math-method: mathjax
    include-before-body: _macros.html
    fig-align: center
    fig-format: png
    fig-dpi: 200
    smooth-scroll: true
