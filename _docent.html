<!-- Bewerkknop voor de docent.
     Verborgen voor iedereen. Eenmalig openen met ?docent achter het adres zet
     de knop aan in die browser; ?docent=uit zet hem weer uit. -->
<style>
  #docent-bewerk {
    position: fixed; right: 1.2rem; bottom: 1.2rem; z-index: 2000;
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .55rem 1rem; border-radius: 999px;
    background: var(--accent, #1f5f6e); color: #fff !important;
    font: 500 15px/1.2 "Source Sans 3", system-ui, sans-serif;
    text-decoration: none !important; box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  #docent-bewerk:hover { filter: brightness(1.12); }
  @media print { #docent-bewerk { display: none; } }
</style>
<script>
(function () {
  var SLEUTEL = "fc-docent";
  var REPO = "https://github.com/dejonges/fysicochemie-cursus/edit/main/";
  var aan = false;
  try {
    var p = new URLSearchParams(location.search);
    if (p.has("docent")) {
      if (p.get("docent") === "uit") localStorage.removeItem(SLEUTEL);
      else localStorage.setItem(SLEUTEL, "1");
      p.delete("docent");
      var q = p.toString();
      history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash);
    }
    aan = localStorage.getItem(SLEUTEL) === "1";
  } catch (e) { aan = false; }
  if (!aan) return;

  document.addEventListener("DOMContentLoaded", function () {
    var naam = location.pathname.split("/").pop() || "index.html";
    if (!/\.html$/.test(naam)) return;
    var a = document.createElement("a");
    a.id = "docent-bewerk";
    a.href = REPO + naam.replace(/\.html$/, ".qmd");
    a.target = "_blank";
    a.rel = "noopener";
    a.title = "Opent deze pagina in de GitHub-editor (alleen zichtbaar voor jou)";
    a.textContent = "✎ Bewerk deze pagina";
    document.body.appendChild(a);
  });
})();
</script>
